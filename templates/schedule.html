{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-semibold mb-4">Schedule message</h2>
<form action="/schedule" method="post" class="space-y-4">
  <div>
    <label class="block text-slate-300 mb-1">Groups</label>
    <div class="max-h-60 overflow-auto border border-slate-800 rounded-lg p-3 space-y-2 bg-slate-900/40">
      {% for g in groups %}
      <label class="flex items-center gap-2">
        <input type="checkbox" name="groups" value="{{ g.id }}" class="accent-blue-600" />
        <span class="text-slate-200">{{ g.title }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <div>
    <label class="block text-slate-300 mb-1">Message</label>
    <textarea name="message" rows="4" placeholder="Type your message..." required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
  </div>

  <div>
    <label class="block text-slate-300 mb-1">Schedule type</label>
    <div class="flex items-center gap-6 text-slate-300">
      <label class="inline-flex items-center gap-2"><input type="radio" name="stype" value="once" checked class="accent-blue-600" />One-time</label>
      <label class="inline-flex items-center gap-2"><input type="radio" name="stype" value="interval" class="accent-blue-600" />Recurring</label>
    </div>
  </div>

  <div id="onceFields">
    <label class="block text-slate-300 mb-1">Run at</label>
    <input name="run_at" type="datetime-local" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600" />
  </div>

  <div id="intervalFields" style="display:none">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-slate-300 mb-1">Unit</label>
        <select name="unit" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600">
          <option value="minute">Minute</option>
          <option value="hour">Hour</option>
        </select>
      </div>
      <div>
        <label class="block text-slate-300 mb-1">Every (units)</label>
        <input name="every" type="number" min="1" value="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600" />
      </div>
    </div>
    <div class="mt-2">
      <label class="block text-slate-300 mb-1">Start after (seconds)</label>
      <input name="start_after" type="number" min="0" value="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600" />
    </div>
  </div>

  <div class="flex items-center gap-2">
    <button class="bg-blue-600 hover:bg-blue-700 transition text-white rounded-lg px-4 py-2" type="submit">Save schedule</button>
    <a class="bg-slate-800 hover:bg-slate-700 transition text-slate-100 rounded-lg px-4 py-2" href="/jobs">View jobs</a>
  </div>
</form>

<script>
const stypeInputs = document.querySelectorAll('input[name="stype"]');
const onceFields = document.getElementById('onceFields');
const intervalFields = document.getElementById('intervalFields');
stypeInputs.forEach(r => r.addEventListener('change', () => {
  if (document.querySelector('input[name="stype"]:checked').value === 'once') {
    onceFields.style.display = 'block';
    intervalFields.style.display = 'none';
  } else {
    onceFields.style.display = 'none';
    intervalFields.style.display = 'block';
  }
}));
</script>
{% endblock %}
