<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>زمانبندی پیام تلگرام</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
        header { background: #111827; padding: 12px 20px; display: flex; gap: 12px; align-items: center; }
        a { color: #93c5fd; text-decoration: none; }
        .container { max-width: 920px; margin: 24px auto; background: #111827; padding: 20px; border-radius: 10px; }
        .btn { background: #2563eb; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
        .btn.secondary { background: #374151; }
        input, select, textarea { width: 100%; background: #0b1220; color: #e2e8f0; border: 1px solid #374151; border-radius: 8px; padding: 10px; margin: 6px 0 14px; }
        label { display: block; margin-top: 10px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .error { background: #7f1d1d; color: #fecaca; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border-bottom: 1px solid #1f2937; padding: 8px; text-align: right; }
        .muted { color: #9ca3af; font-size: 12px; }
    </style>
    {% block head %}{% endblock %}
 </head>
<body>
    <header>
        <a href="/">ورود</a>
        <a href="/schedule">زمانبندی</a>
        <a href="/jobs">کارها</a>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
