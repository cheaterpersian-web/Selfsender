<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telegram Message Scheduler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-100">
  <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
      <div class="font-semibold text-slate-200">Telegram Scheduler</div>
      <nav class="text-slate-300 text-sm flex gap-4">
        <a class="hover:text-white" href="/">Login</a>
        <a class="hover:text-white" href="/schedule">Schedule</a>
        <a class="hover:text-white" href="/jobs">Jobs</a>
      </nav>
    </div>
  </header>
  <main class="max-w-4xl mx-auto p-4">
    <div class="bg-slate-900/60 rounded-xl border border-slate-800 p-6 shadow-lg">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
