{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-semibold mb-4">Verify code</h2>
{% if error %}<div class="mb-4 rounded-lg border border-red-900/50 bg-red-950/50 text-red-200 px-3 py-2">{{ error }}</div>{% endif %}
<p class="text-slate-300 mb-3">Enter the code sent to {{ phone }}.</p>
<form action="/verify" method="post" class="space-y-3">
  <div>
    <label class="block text-slate-300 mb-1">Code</label>
    <input name="code" type="text" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600" />
  </div>
  <div>
    <label class="block text-slate-300 mb-1">2FA password (if enabled)</label>
    <input name="password" type="password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600" />
  </div>
  <div class="flex items-center gap-2">
    <button class="bg-blue-600 hover:bg-blue-700 transition text-white rounded-lg px-4 py-2" type="submit">Verify</button>
    <a class="bg-slate-800 hover:bg-slate-700 transition text-slate-100 rounded-lg px-4 py-2" href="/">Back</a>
  </div>
</form>
{% endblock %}
